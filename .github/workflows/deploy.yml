name: CD - Vercel
on:
  workflow_run:
    workflows: ['CI - pruebas']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && vars.ENABLE_VERCEL_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validar secretos
        run: test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
      - name: Instalar CLI
        run: npm install --global vercel@50.4.0
      - name: Obtener configuración
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Construir
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Publicar versión validada
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
