name: Verificar acceso a Vercel
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Comprobar acceso sin mostrar credenciales
        shell: bash
        run: |
          node <<'JS'
          (async () => {
            for (const key of ['VERCEL_ORG_ID', 'VERCEL_PROJECT_ID', 'VERCEL_TOKEN']) {
              const value = process.env[key];
              if (!value) throw new Error('Falta ' + key);
              if (value !== value.trim()) throw new Error(key + ' contiene espacios o saltos de línea al principio/final');
            }
            if (!/^team_[A-Za-z0-9]+$/.test(process.env.VERCEL_ORG_ID)) throw new Error('VERCEL_ORG_ID debe ser un Team ID que empiece por team_');
            if (!/^prj_[A-Za-z0-9]+$/.test(process.env.VERCEL_PROJECT_ID)) throw new Error('VERCEL_PROJECT_ID debe empezar por prj_');
            const url = new URL('https://api.vercel.com/v9/projects/' + encodeURIComponent(process.env.VERCEL_PROJECT_ID));
            url.searchParams.set('teamId', process.env.VERCEL_ORG_ID);
            const response = await fetch(url, { headers: { Authorization: 'Bearer ' + process.env.VERCEL_TOKEN }, signal: AbortSignal.timeout(20000) });
            console.log('Consulta de proyecto en Vercel: HTTP ' + response.status);
            if (!response.ok) {
              const data = await response.json().catch(() => ({}));
              console.log('Código de error de Vercel:', data.error?.code || 'sin código');
              throw new Error('No hay acceso al proyecto: 401 indica autenticación; 403 permisos; 404 proyecto/equipo inexistente o no visible para el token');
            }
            const data = await response.json();
            console.log('Nombre del proyecto:', data.name);
            console.log('Proyecto esperado:', data.name === 'folio-inventario-node');
            console.log('Equipo coincidente:', data.accountId === process.env.VERCEL_ORG_ID);
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          JS
